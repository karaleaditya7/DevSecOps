name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eslint:
    name: ESLint SAST Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npx eslint . --format json -o eslint-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secure-app .
      - run: trivy image --format json --output trivy-report.json secure-app || true
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

